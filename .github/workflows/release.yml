# Pushing a tag like v0.2.0 tests and builds the app on GitHub's Windows machine and publishes
# a release with MarstekMonitor-<version>-win64.zip. The tag must match marstek_monitor/__init__.py.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload the zip

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install (pinned versions, the same as the tested local build)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -c packaging\constraints.txt -e ".[dev]"

      - name: Check the tag matches the app version
        run: |
          $version = .venv\Scripts\python -c "import marstek_monitor; print(marstek_monitor.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match the app version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests
        run: .venv\Scripts\python -m pytest -q

      - name: Build
        run: packaging\build.ps1

      - name: Zip
        run: Compress-Archive -Path dist\MarstekMonitor -DestinationPath "MarstekMonitor-$env:VERSION-win64.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "packaging\release-notes.md"
          $own = "docs\releases\${{ github.ref_name }}.md"
          if (Test-Path $own) { Get-Content $own, $notes | Set-Content notes.md } else { Copy-Item $notes notes.md }
          gh release create "${{ github.ref_name }}" "MarstekMonitor-$env:VERSION-win64.zip" `
            --title "Marstek Monitor $env:VERSION" --notes-file notes.md
